<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lost Toolbox — 10MM Side Quest</title><style>*{box-sizing:border-box}body{margin:0;background:#101722;color:#fff;font:16px system-ui}main{max-width:900px;margin:auto;padding:12px}h1{color:#ffcb43;margin:5px 0}p{color:#c7d2df;margin:5px 0 12px}canvas{display:block;width:100%;aspect-ratio:16/9;border:3px solid #536679;border-radius:14px;background:#172436;touch-action:none}.hud{display:flex;justify-content:space-between;gap:8px;margin:8px 0;font-weight:bold}.controls{display:flex;justify-content:space-between;gap:12px;margin:12px 0}.controls div{display:flex;gap:10px}button{background:#ffcb43;color:#171b24;border:0;border-radius:14px;min-width:70px;min-height:65px;font-size:23px;font-weight:900;touch-action:none}button:active{background:#f8e7a1}.muted{color:#c3cfdb;font-size:13px}</style></head><body><main><h1>🔧 THE LOST TOOLBOX</h1><p>Five levels. Five drawers. One golden socket. Jump the shop pits and reach each toolbox!</p><div class="hud"><span id="level">LEVEL 1 / 5</span><span id="coins">COINS 0</span><span id="status">READY</span></div><canvas id="game" width="960" height="540" aria-label="Side-scrolling socket platform game"></canvas><div class="controls"><div><button id="left" aria-label="Move left">◀</button><button id="right" aria-label="Move right">▶</button></div><div><button id="jump">JUMP</button><button id="restart" aria-label="Restart">↻</button></div></div><p class="muted">Keyboard: ← → or A/D to move, Space/↑ to jump. Double jump available. This preview is separate from the main game.</p></main><script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),W=960,H=540,ground=425;let level=0,coins=0,won=false,dead=false,cam=0,keys={left:false,right:false},jumpQueued=false,player,obstacles,collectibles,drawer,length,frame=0;const names=['GARAGE ESCAPE','LIFT BAY MAYHEM','PARTS DEPARTMENT PANIC','ENGINE ROOM CHAOS','MASTER TOOLBOX'];const themes=[['#263a51','#384e61'],['#294553','#406a73'],['#4a405b','#5f5375'],['#51433d','#77604e'],['#292c43','#4d385a']];const $=id=>document.getElementById(id);function reset(){player={x:70,y:ground-46,vx:0,vy:0,w:49,h:46,jumps:0,inv:0};cam=0;dead=false;won=false;frame=0;length=3100+level*350;obstacles=[];collectibles=[];for(let i=0;i<9+level*2;i++){let x=350+i*(265-level*8);let type=i%4===0?'pit':i%3===0?'tire':i%2===0?'drum':'pan';obstacles.push({x,w:type==='pit'?110+level*9:type==='drum'?51:65,type});if(i%2===0)collectibles.push({x:x+140,y:ground-115,taken:false})}drawer={x:length-150};$('level').textContent='LEVEL '+(level+1)+' / 5 — '+names[level];$('status').textContent='FIND THE DRAWER';}function jump(){if(won){level=0;coins=0;reset();return}if(dead){reset();return}if(player.jumps<2){player.vy=player.jumps===0?-13.7:-11.7;player.jumps++}}function die(){dead=true;$('status').textContent='TRY AGAIN — JUMP OR ↻'}function complete(){if(won)return;if(level<4){level++;reset()}else{won=true;$('status').textContent='GOLDEN 10MM UNLOCKED!';try{localStorage.setItem('lostToolboxGolden10mm','unlocked')}catch(e){}}}function update(){frame++;if(dead||won)return;player.vx=(keys.right?5.6:0)-(keys.left?5.6:0);player.x=Math.max(0,Math.min(length-60,player.x+player.vx));player.vy+=0.65;player.y+=player.vy;const mid=player.x+player.w/2;let overPit=obstacles.some(o=>o.type==='pit'&&mid>o.x+7&&mid<o.x+o.w-7);if(player.y+player.h>=ground&&!overPit&&player.vy>=0){player.y=ground-player.h;player.vy=0;player.jumps=0}if(player.y>H+100)die();for(const o of obstacles){if(o.type==='pit')continue;const h=o.type==='drum'?77:o.type==='tire'?58:26;const ox=o.x,oy=ground-h;if(player.x<ox+o.w-9&&player.x+player.w>ox+9&&player.y<oy+h-8&&player.y+player.h>oy+9){if(player.vy>0&&player.y+player.h-player.vy<=oy+12){player.y=oy-player.h;player.vy=0;player.jumps=0}else die()}}for(const c of collectibles){if(!c.taken&&Math.abs(mid-c.x)<38&&Math.abs(player.y+20-c.y)<50){c.taken=true;coins+=10;$('coins').textContent='COINS '+coins}}if(player.x+player.w>drawer.x+40)complete();cam=Math.max(0,Math.min(length-W,player.x-220))}function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function draw(){const t=themes[level];const sky=ctx.createLinearGradient(0,0,0,ground);sky.addColorStop(0,t[0]);sky.addColorStop(1,t[1]);rect(0,0,W,H,sky);ctx.save();ctx.translate(-cam,0);for(let x=0;x<length;x+=310){rect(x+25,140,230,275,'#1d2735');rect(x+37,160,206,245,'#354354');rect(x+70,190,135,125,'#1b222d');rect(x+50,337,45,64,'#ad2634');rect(x+105,348,60,53,'#536b78');rect(x+178,350,43,50,'#bd8735');rect(x+30,120,235,15,'#edbc49')}rect(0,ground,length,H-ground,'#42464d');rect(0,ground,length,13,'#e5a72f');for(let x=0;x<length;x+=120)rect(x,490,55,4,'#60646c');for(const o of obstacles){if(o.type==='pit'){rect(o.x,ground,o.w,H-ground,'#080c15');rect(o.x-9,ground-6,10,15,'#ffcb43');rect(o.x+o.w,ground-6,10,15,'#ffcb43')}else if(o.type==='drum'){rect(o.x,ground-77,51,77,'#bd2532');rect(o.x,ground-77,51,8,'#f65a4d');rect(o.x,ground-42,51,7,'#ee6453');rect(o.x+15,ground-59,20,20,'#ffcb43')}else if(o.type==='pan'){rect(o.x,ground-26,65,24,'#151b22');rect(o.x-4,ground-27,73,8,'#a6b5bf');rect(o.x+14,ground-22,34,7,'#76532e')}else{ctx.fillStyle='#171c23';ctx.beginPath();ctx.arc(o.x+31,ground-29,29,0,Math.PI*2);ctx.fill();ctx.fillStyle='#abb5bd';ctx.beginPath();ctx.arc(o.x+31,ground-29,14,0,Math.PI*2);ctx.fill()}}for(const c of collectibles){if(c.taken)continue;ctx.fillStyle='#ffcf38';ctx.beginPath();ctx.arc(c.x,c.y+Math.sin(frame/12+c.x)*5,15,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff3a6';ctx.lineWidth=4;ctx.stroke()}rect(drawer.x,ground-130,120,130,'#c42734');for(let i=0;i<3;i++){rect(drawer.x+12,ground-115+i*35,95,29,'#e43c3b');rect(drawer.x+45,ground-106+i*35,29,5,'#e7e8ec')}rect(drawer.x+10,ground-72,100,39,'#ffd454');ctx.font='bold 17px system-ui';ctx.fillStyle='#1d222b';ctx.fillText('EXIT',drawer.x+44,ground-47);const x=player.x,y=player.y;ctx.save();ctx.translate(x,y);ctx.fillStyle='#aebfcb';ctx.strokeStyle='#121820';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(0,0,49,46,12);ctx.fill();ctx.stroke();rect(6,32,37,8,'#e6e9ee');ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(17,18,8,9,0,0,Math.PI*2);ctx.ellipse(34,18,8,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(19,19,4,0,Math.PI*2);ctx.arc(36,19,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#171820';ctx.font='bold 13px system-ui';ctx.fillText('10mm',5,42);ctx.restore();ctx.restore();if(dead||won){rect(0,0,W,H,'#0009');ctx.textAlign='center';ctx.fillStyle='#ffcf42';ctx.font='bold 43px system-ui';ctx.fillText(won?'GOLDEN 10MM UNLOCKED!':'SOCKET LOST!',W/2,220);ctx.fillStyle='white';ctx.font='24px system-ui';ctx.fillText(won?'Tap JUMP to replay':'Tap JUMP or ↻ to retry',W/2,267);ctx.textAlign='left'}}function tick(){update();draw();requestAnimationFrame(tick)}function bind(id,key){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys[key]=false)}bind('left','left');bind('right','right');$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('restart').addEventListener('click',reset);window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;if((e.code==='Space'||e.code==='ArrowUp')&&!e.repeat)jump()});window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false});reset();tick()})();
</script></body></html>
