<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Where's My 10MM?! — Socket Escape</title><style>*{box-sizing:border-box}body{margin:0;background:#10151d;color:#fff;font:15px system-ui,Arial;display:flex;justify-content:center}main{width:min(100%,680px);min-height:100dvh;background:linear-gradient(#2a3440,#111820);display:flex;flex-direction:column}header{padding:20px 18px 8px}h1{margin:0;color:#ffcd49;font-size:clamp(23px,5vw,33px)}small{color:#bac6d4}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 14px}.stats>div{text-align:center;background:#263544;border:1px solid #516172;border-radius:12px;padding:10px 3px}.stats strong{display:block;color:#ffcc49;font-size:22px}.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px}#scene{width:100%;aspect-ratio:1.3;max-height:65dvh;object-fit:contain;border:2px solid #58697b;border-radius:15px;background:#202a32;touch-action:none;box-shadow:0 14px 30px #0008}.stage p{text-align:center;color:#c4d1dc;min-height:25px}.buttons{display:grid;grid-template-columns:2fr 1fr;gap:10px;padding:10px 14px max(20px,env(safe-area-inset-bottom))}button{border:0;border-radius:12px;min-height:62px;font-size:19px;font-weight:900;background:#ffcb43;color:#1a2630;touch-action:manipulation}button.secondary{background:#3d5063;color:white}.overlay{position:fixed;inset:0;background:#080c12dc;display:grid;place-items:center;padding:18px;z-index:3}.overlay.hidden{display:none}.panel{max-width:390px;background:#263645;border:1px solid #718093;border-radius:19px;padding:26px;text-align:center}.panel h2{font-size:28px;color:#ffce49;margin-top:0}.panel p{line-height:1.6;color:#d4e0e8}.panel button{width:100%}</style></head><body><main><header><h1>WHERE'S MY 10MM?!</h1><small>SOCKET ESCAPE • VERSION 6.2</small></header><div class="stats"><div>LEVEL<strong id="level">1 / 200</strong></div><div>DISTANCE<strong id="distance">0%</strong></div><div>BEST<strong id="best">1</strong></div></div><section class="stage"><canvas id="scene" width="600" height="460" aria-label="Rolling socket obstacle game"></canvas><p id="tip">Tap JUMP to hop over garage tools!</p></section><div class="buttons"><button id="jump">⬆ JUMP</button><button id="restart" class="secondary">↻ Restart</button></div></main><div class="overlay" id="overlay"><div class="panel"><h2 id="message">THE 10MM ESCAPE!</h2><p id="details">Roll your 10mm socket across the garage. Tap to jump over tools and reach the hiding place beneath the toolbox, cart, workbench or car!</p><button id="go">START ROLLING</button></div></div><script>
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),W=600,H=460,ground=373,$=id=>document.getElementById(id);
const art={};['socket10','wrench','pliers','ratchet','phillips','flathead','bolt','nut','meter'].forEach(n=>{let im=new Image();art[n]=im;im.src=n+'.png'});
let level=1,best=Math.max(1,Math.min(200,+(localStorage.getItem('tenmm-escape-best')||1))),state='menu',player={x:118,y:ground-27,vy:0,r:26,angle:0},scroll=0,world=2300,obstacles=[],last=0,frames=0;
const kinds=['wrench','pliers','ratchet','phillips','flathead','bolt','nut','meter'],destinations=['TOOLBOX','TOOL CART','CAR','WORKBENCH'];
function rnd(seed){let x=Math.sin(seed*127.1+level*83.7)*43758.5453;return x-Math.floor(x)}
function createLevel(){scroll=0;frames=0;player={x:118,y:ground-27,vy:0,r:26,angle:0};world=2200+Math.min(3500,(level-1)*22);obstacles=[];let spacing=Math.max(125,270-level*.85);for(let x=420,i=0;x<world-370;x+=spacing,i++){let kind=kinds[Math.floor(rnd(i+2)*kinds.length)];let w=kind==='meter'?57:kind==='pliers'?76:kind==='wrench'||kind==='ratchet'?90:kind==='nut'?43:57;let h=kind==='meter'?58:kind==='pliers'?38:kind==='wrench'||kind==='ratchet'?26:kind==='nut'?34:40;obstacles.push({x:x+(rnd(i+19)-.5)*36,w,h,kind,angle:(rnd(i+44)-.5)*.35})} $('level').textContent=level+' / 200';$('best').textContent=best;$('distance').textContent='0%';$('tip').textContent='Jump over tools. Hide under the '+destinations[(level-1)%4].toLowerCase()+'!'}
function start(){createLevel();state='running';$('overlay').classList.add('hidden');last=0;requestAnimationFrame(tick)}
function popup(title,desc,button,callback){state='stopped';$('message').textContent=title;$('details').textContent=desc;$('go').textContent=button;$('overlay').classList.remove('hidden');$('go').onclick=callback}
function jump(){if(state!=='running')return;if(player.y>=ground-player.r-2){player.vy=-16.5;player.y-=3}}
$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});canvas.addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});$('restart').onclick=()=>{start()};$('go').onclick=start;
function image(n,x,y,w,h,rotation=0){let im=art[n];ctx.save();ctx.translate(x,y);ctx.rotate(rotation);if(im&&im.complete&&im.naturalWidth){ctx.drawImage(im,-w/2,-h/2,w,h)}else{ctx.fillStyle='#cbd4db';ctx.fillRect(-w/2,-h/2,w,h);ctx.strokeStyle='#64727d';ctx.strokeRect(-w/2,-h/2,w,h)}ctx.restore()}
function toolIllustration(kind,x,y,w,h,rotation=0){
ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.scale(w/100,h/100);
let metal=ctx.createLinearGradient(0,-24,0,24);metal.addColorStop(0,'#f8fcff');metal.addColorStop(.23,'#9daeb9');metal.addColorStop(.5,'#eef4f7');metal.addColorStop(.75,'#6f8493');metal.addColorStop(1,'#d9e3ea');
ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle='#273c49';ctx.lineWidth=3;
function shape(path,fill=metal){ctx.beginPath();path();ctx.fillStyle=fill;ctx.fill();ctx.stroke()}
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.stroke()}
if(kind==='wrench'){shape(()=>{ctx.moveTo(-47,-13);ctx.lineTo(-37,-5);ctx.lineTo(-24,-14);ctx.lineTo(-21,-27);ctx.lineTo(-36,-35);ctx.lineTo(-46,-29);ctx.lineTo(-49,-16);ctx.lineTo(-44,-5);ctx.lineTo(26,5);ctx.arc(37,9,13,Math.PI,Math.PI*3);ctx.lineTo(-35,8);ctx.closePath()});circle(36,9,8,'#23333e');ctx.strokeStyle='#ffffffaa';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-26,-2);ctx.lineTo(21,6);ctx.stroke()}
else if(kind==='ratchet'){shape(()=>{ctx.roundRect(-42,-7,73,14,6)});shape(()=>{ctx.roundRect(22,-16,27,32,7)});circle(35,0,10,'#465e70');circle(35,0,5,'#d8e3e9');ctx.fillStyle='#536a7b';ctx.fillRect(-35,-4,30,8)}
else if(kind==='pliers'){shape(()=>{ctx.moveTo(-7,0);ctx.lineTo(-49,-31);ctx.lineTo(-42,-39);ctx.lineTo(3,-9);ctx.lineTo(28,-32);ctx.lineTo(37,-27);ctx.lineTo(14,0);ctx.lineTo(37,30);ctx.lineTo(28,36);ctx.lineTo(1,9);ctx.lineTo(-42,36);ctx.lineTo(-49,29);ctx.closePath()});ctx.strokeStyle='#bb3034';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(8,10);ctx.lineTo(34,31);ctx.moveTo(-1,10);ctx.lineTo(-41,31);ctx.stroke();ctx.strokeStyle='#273c49';ctx.lineWidth=3;circle(6,0,6,'#566c79')}
else if(kind==='phillips'||kind==='flathead'){shape(()=>{ctx.roundRect(-46,-4,72,8,3)});shape(()=>{ctx.roundRect(17,-12,30,24,8)},'#b82b30');ctx.fillStyle='#f3a0a2';ctx.fillRect(23,-8,5,16);ctx.strokeStyle='#e9f0f4';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-46,0);ctx.lineTo(-39,0);ctx.stroke()}
else if(kind==='bolt'){shape(()=>{ctx.roundRect(-30,-8,65,16,3)});shape(()=>{ctx.moveTo(-45,-17);ctx.lineTo(-30,-22);ctx.lineTo(-18,-16);ctx.lineTo(-18,16);ctx.lineTo(-30,22);ctx.lineTo(-45,16);ctx.closePath()});ctx.strokeStyle='#607687';ctx.lineWidth=2;for(let i=-12;i<32;i+=7){ctx.beginPath();ctx.moveTo(i,-8);ctx.lineTo(i+6,8);ctx.stroke()}}
else if(kind==='nut'){shape(()=>{for(let i=0;i<6;i++){let a=i*Math.PI/3;let xx=Math.cos(a)*34,yy=Math.sin(a)*37;if(!i)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)}ctx.closePath()});circle(0,0,17,'#263945');circle(0,0,11,'#667d8c')}
else if(kind==='meter'){shape(()=>{ctx.roundRect(-31,-47,62,94,11)},'#ce3d32');shape(()=>{ctx.roundRect(-24,-37,48,34,4)},'#c4e3d7');ctx.fillStyle='#1a3532';ctx.font='bold 16px monospace';ctx.fillText('12.6',-20,-15);circle(0,22,12,'#24333d');ctx.strokeStyle='#e5edf2';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,22);ctx.lineTo(6,14);ctx.stroke()}
ctx.restore()}
function destination(x){let type=(level-1)%4;ctx.save();ctx.translate(x,0);if(type===0||type===1){ctx.fillStyle=type===0?'#a72227':'#325b85';ctx.fillRect(0,200,185,154);ctx.fillStyle='#17222b';for(let j=0;j<3;j++){ctx.fillRect(12,212+j*42,160,31);ctx.fillStyle='#a6b6c4';ctx.fillRect(84,223+j*42,28,4);ctx.fillStyle='#17222b'}ctx.fillStyle='#b9c6ce';ctx.fillRect(18,352,19,16);ctx.fillRect(151,352,19,16)}else if(type===2){ctx.fillStyle='#c9d4dc';ctx.beginPath();ctx.moveTo(-20,298);ctx.lineTo(10,265);ctx.lineTo(55,249);ctx.lineTo(98,204);ctx.lineTo(165,204);ctx.lineTo(208,259);ctx.lineTo(245,275);ctx.lineTo(258,328);ctx.lineTo(232,341);ctx.lineTo(-20,341);ctx.closePath();ctx.fill();ctx.fillStyle='#526677';ctx.fillRect(107,213,51,45);ctx.fillStyle='#161c23';for(let wx of [42,194]){ctx.beginPath();ctx.arc(wx,341,28,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8c9aa8';ctx.beginPath();ctx.arc(wx,341,12,0,Math.PI*2);ctx.fill()}}else{ctx.fillStyle='#9b6d43';ctx.fillRect(-5,224,242,19);ctx.fillStyle='#b1bdc9';ctx.fillRect(10,243,16,126);ctx.fillRect(215,243,16,126);ctx.fillStyle='#516371';ctx.fillRect(25,263,190,15)}ctx.fillStyle='#ffcb43';ctx.font='bold 15px system-ui';ctx.fillText('HIDE HERE',20,189);ctx.restore()}
function render(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#303d4a');bg.addColorStop(1,'#18212b');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#4a5b69';ctx.lineWidth=2;for(let x=-(scroll*.18%80);x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,ground);ctx.stroke()}ctx.fillStyle='#4c5359';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#747b80';ctx.fillRect(0,ground,W,7);ctx.strokeStyle='#62686e';for(let x=-(scroll%95);x<W;x+=95){ctx.beginPath();ctx.moveTo(x,ground+7);ctx.lineTo(x-45,H);ctx.stroke()}
for(const o of obstacles){let x=o.x-scroll;if(x< -110||x>W+120)continue;ctx.save();ctx.translate(x,ground-o.h/2);ctx.rotate(o.angle);toolIllustration(o.kind,0,0,o.w,o.h);ctx.restore()}
let dx=world-scroll-210;if(dx<W+290)destination(dx);
ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);image('socket10',0,0,52,52);ctx.restore();
ctx.fillStyle='#e9eef3';ctx.font='bold 14px system-ui';ctx.fillText('10mm',player.x-21,player.y-39);
ctx.fillStyle='#ffcb43';ctx.fillRect(0,0,W*Math.min(1,(scroll+player.x)/(world-100)),5)}
function tick(t){if(state!=='running')return;let dt=Math.min(2.2,(t-(last||t))/16.67);last=t;let speed=(3.25+Math.min(2.9,level*.022))*dt;scroll+=speed;player.vy+=.48*dt;player.y+=player.vy*dt;if(player.y>ground-player.r){player.y=ground-player.r;player.vy=0}player.angle+=speed*.045+(player.vy!==0?.035:0);$('distance').textContent=Math.min(100,Math.floor((scroll+player.x)/world*100))+'%';
for(const o of obstacles){let x=o.x-scroll;if(Math.abs(x-player.x)<player.r+o.w*.40&&player.y+player.r>ground-o.h+7&&player.y-player.r<ground-3){render();popup('CLANK! 💥','Your 10mm hit a '+o.kind+'. Try timing your jumps to get underneath the '+destinations[(level-1)%4].toLowerCase()+'.','TRY AGAIN',start);return}}
if(scroll+player.x>=world-170){best=Math.max(best,Math.min(200,level+1));localStorage.setItem('tenmm-escape-best',best);render();popup('THE 10MM VANISHED! 🎉','You escaped underneath the '+destinations[(level-1)%4].toLowerCase()+'! Ready for the next garage?',level===200?'PLAY AGAIN':'NEXT LEVEL',()=>{level=level===200?1:level+1;start()});return}
render();requestAnimationFrame(tick)}
createLevel();render();
</script></body></html>
