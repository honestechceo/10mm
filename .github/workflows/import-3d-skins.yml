name: Import 3D socket skins ZIP
run-name: Import socket skins from release ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing the 29-skin ZIP (example: skins-upload-1)"
        required: true
        default: skins-upload-1
      zip_name:
        description: "Exact ZIP filename attached to that release"
        required: true
        default: 10mm_all_rolling_skins_348_frames.zip

permissions:
  contents: write

concurrency:
  group: import-3d-skins
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out animation PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/3d-rolling-skin-loader
          persist-credentials: true

      - name: Download ZIP from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          mkdir -p /tmp/skin-import
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ZIP_NAME" --dir /tmp/skin-import
          test -s "/tmp/skin-import/$ZIP_NAME"

      - name: Validate and extract skin frames without mixing folders
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          python3 - <<'PY'
          import os, zipfile, pathlib, re, collections, struct
          zpath=pathlib.Path('/tmp/skin-import')/os.environ['ZIP_NAME']
          target=pathlib.Path('skins3d')
          with zipfile.ZipFile(zpath) as z:
              frames=collections.defaultdict(dict)
              for info in z.infolist():
                  if info.is_dir(): continue
                  p=pathlib.PurePosixPath(info.filename)
                  if p.name in ('manifest_complete.json','README_COMPLETE.txt') and len(p.parts)==1: continue
                  if len(p.parts)!=2 or not re.fullmatch(r'[a-z0-9_]+',p.parts[0]) or not re.fullmatch(r'frame_(0[0-9]|1[01])\.png',p.parts[1]):
                      raise ValueError('Unexpected file in ZIP: '+info.filename)
                  folder=p.parts[0]; frame=p.parts[1]
                  if frame in frames[folder]: raise ValueError('Duplicate frame: '+info.filename)
                  data=z.read(info)
                  if not data.startswith(b'\x89PNG\r\n\x1a\n'): raise ValueError('Not PNG: '+info.filename)
                  if len(data)<26 or data[25]!=6: raise ValueError('Not RGBA PNG: '+info.filename)
                  frames[folder][frame]=data
              if len(frames)!=29 or sum(map(len,frames.values()))!=348:
                  raise ValueError('Expected 29 skin folders and 348 frames, got '+str(len(frames))+' folders and '+str(sum(map(len,frames.values())))+' frames')
              expected={f'frame_{i:02d}.png' for i in range(12)}
              for folder, files in frames.items():
                  if set(files)!=expected: raise ValueError('Incomplete frames in '+folder)
              for folder, files in frames.items():
                  dest=target/folder
                  dest.mkdir(parents=True,exist_ok=True)
                  for filename,data in files.items():
                      (dest/filename).write_bytes(data)
          print('Validated and extracted 29 skin folders / 348 RGBA PNG frames')
          PY

      - name: Commit assets to the existing pull request branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skins3d/
          if git diff --cached --quiet; then
            echo "Assets already imported."
          else
            git commit -m "Import 29 3D socket skins with 348 ordered animation frames"
            git push origin HEAD:feature/3d-rolling-skin-loader
          fi
