workflows:
  ios-testflight:
    name: Where's My 10MM — TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    # Must match the NAME you gave your App Store Connect API key in
    # Codemagic → Team integrations → Developer Portal → Manage keys.
    integrations:
      app_store_connect: codemagic
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.honestech.wheresmy10mm
      vars:
        BUNDLE_ID: "com.honestech.wheresmy10mm"
        APP_VERSION: "1.0.0"
    scripts:
      - name: Install dependencies and package game
        script: |
          npm install
          npm run build:web
      - name: Generate and sync Capacitor iOS project
        script: |
          npx cap add ios
          npx capacitor-assets generate --ios
          npx cap sync ios
      - name: App settings (portrait, encryption, version, build number)
        script: |
          PLIST=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          # Home-screen name (full name is too long and gets cut off)
          $PB -c "Set :CFBundleDisplayName 10MM?!" "$PLIST" || $PB -c "Add :CFBundleDisplayName string 10MM?!" "$PLIST"
          # No custom encryption -> skips the "Missing Compliance" prompt on every build
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || $PB -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          # Portrait only on iPhone
          $PB -c "Delete :UISupportedInterfaceOrientations" "$PLIST" || true
          $PB -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          $PB -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          $PB -c "Add :UIRequiresFullScreen bool true" "$PLIST" || $PB -c "Set :UIRequiresFullScreen true" "$PLIST"
          $PB -c "Add :UIStatusBarHidden bool true" "$PLIST" || $PB -c "Set :UIStatusBarHidden true" "$PLIST"
          $PB -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PLIST" || $PB -c "Set :UIViewControllerBasedStatusBarAppearance false" "$PLIST"
          # Unique build number every run (TestFlight rejects repeats)
          BUILD_NO=$((BUILD_NUMBER + 100))
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9.]*;/CURRENT_PROJECT_VERSION = $BUILD_NO;/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = $APP_VERSION;/g" ios/App/App.xcodeproj/project.pbxproj
          $PB -c "Set :CFBundleVersion $BUILD_NO" "$PLIST"
          $PB -c "Set :CFBundleShortVersionString $APP_VERSION" "$PLIST"
          echo "Version $APP_VERSION ($BUILD_NO)"
      - name: Configure signing
        script: |
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # External testers need Beta App Review; turn this on once
        # you have a "Beta" group set up in App Store Connect.
        # beta_groups:
        #   - Beta
