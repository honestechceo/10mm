function renderShop(){const box=$('shop'),own=ownedSkins(),eq=equippedSkin();box.innerHTML='';const list=[...SKINS.filter(k=>!k.holiday),...SKINS.filter(k=>k.holiday&&inSeason(k)),...SKINS.filter(k=>k.holiday&&!inSeason(k))];let headed=false;for(const sk of list){if(sk.holiday&&!headed){headed=true;const hd=document.createElement('div');hd.className='lvhead';hd.textContent='HOLIDAY FINISHES';box.append(hd)}const price=skinPrice(sk);const card=document.createElement('div');card.className='skin'+(sk.id===eq?' eq':'');const im=document.createElement('img');im.src=skinFile(sk.id);im.alt=sk.name;const nm=document.createElement('div');nm.textContent=sk.name;const b=document.createElement('button');if(sk.id===eq){b.textContent='EQUIPPED';b.className='own';b.disabled=true}else if(own.includes(sk.id)){b.textContent='EQUIP';b.className='own';b.onclick=()=>{localStorage.setItem('tenmm-skin',sk.id);applySkin();setArt('hero');buzz('light');renderShop()}}else if(totalCoins>=price){b.textContent='BUY • '+price;b.className='buy';b.onclick=()=>{totalCoins-=price;localStorage.setItem('tenmm-coins',totalCoins);own.push(sk.id);localStorage.setItem('tenmm-skins',JSON.stringify(own));localStorage.setItem('tenmm-skin',sk.id);applySkin();setArt('hero');$('coinsCount').textContent=totalCoins;$('details').textContent='Unlocked '+sk.name+'! You have '+totalCoins+' coins left.';sfx('win');buzz('success');renderShop()}}else{b.textContent=price+' COINS';b.className='no';b.disabled=true}card.append(im,nm);if(inSeason(sk)){const tg=document.createElement('div');tg.className='tag';tg.textContent='IN SEASON -50%';card.append(tg)}card.append(b);box.append(card)}}
function showLevels(){state='levels';$('overlay').classList.remove('hidden');$('opts').classList.remove('on');setArt('map');$('eyebrow').textContent='LEVEL SELECT';$('message').textContent='PICK A GARAGE';$('details').textContent='Replay any level you have unlocked ('+best+' of 200).';$('menuExtra').style.display='none';$('menuSettings').style.display='none';$('menuLevels').style.display='none';$('menuShop').style.display='none';$('go').textContent='BACK';$('go').onclick=showMenu;const box=$('levels');box.innerHTML='';const frag=document.createDocumentFragment();for(let n=1;n<=200;n++){if((n-1)%25===0){const hd=document.createElement('div');hd.className='lvhead';hd.textContent=themeOf(n).name;frag.append(hd)}const b=document.createElement('button');b.textContent=n;b.disabled=n>best;if(n===level)b.className='cur';b.onclick=()=>{level=n;try{localStorage.setItem('tenmm-escape-current',n)}catch(e){}storySeen=true;tutorialSeen=true;start()};frag.append(b)}box.append(frag);box.classList.add('on');const cur=box.querySelectorAll('button')[Math.max(0,Math.min(best,level)-1)];if(cur)cur.scrollIntoView({block:'center'})}

function fitCanvas(){const stage=document.querySelector('.stage'),tip=$('tip');const w=canvas.clientWidth||stage.clientWidth-8;const avail=stage.clientHeight-tip.offsetHeight-14;if(!w||avail<120)return;let h=Math.max(460,Math.min(980,Math.round(600*avail/w)));if(h!==CH){CH=h;OFF=CH-460;canvas.height=CH}canvas.style.height=Math.round(w*CH/600)+'px';render()}
window.addEventListener('resize',fitCanvas);window.addEventListener('orientationchange',()=>setTimeout(fitCanvas,250));
createLevel();showMenu();fitCanvas();requestAnimationFrame(fitCanvas);
</script></body></html>
