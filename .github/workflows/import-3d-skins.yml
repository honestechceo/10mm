name: Import 3D socket skins ZIP
run-name: Import socket skins from release ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing the 29-skin ZIP (example: skins-upload-1)"
        required: true
        default: skins-upload-1

permissions:
  contents: write

concurrency:
  group: import-3d-skins
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out animation PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/3d-rolling-skin-loader
          persist-credentials: true

      - name: Download ZIP from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p /tmp/skin-import
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "10mm_skins_part_*_of_4.zip" --dir /tmp/skin-import
          test "$(find /tmp/skin-import -name "10mm_skins_part_*_of_4.zip" | wc -l)" -eq 4

      - name: Validate and extract skin frames without mixing folders
        env:
        run: |
          python3 - <<'PY'
          import os, zipfile, pathlib, re, collections, struct
          zpaths=sorted(pathlib.Path('/tmp/skin-import').glob('10mm_skins_part_*_of_4.zip'))
          if len(zpaths)!=4: raise ValueError('Exactly four ZIP parts required')
          target=pathlib.Path('skins3d')
          frames=collections.defaultdict(dict)
          for zpath in zpaths:
              with zipfile.ZipFile(zpath) as z:
                  for info in z.infolist():
                      if info.is_dir(): continue
                      p=pathlib.PurePosixPath(info.filename)
                      if len(p.parts)!=2 or not re.fullmatch(r'[a-z0-9_]+',p.parts[0]) or not re.fullmatch(r'frame_(0[0-9]|1[01])\\.png',p.parts[1]):
                          raise ValueError('Unexpected ZIP entry: '+info.filename)
                      folder,frame=p.parts
                      if frame in frames[folder]: raise ValueError('Duplicate frame: '+info.filename)
                      data=z.read(info)
                      if not data.startswith(bytes.fromhex('89504e470d0a1a0a')) or len(data)<26 or data[25]!=6:
                          raise ValueError('Invalid RGBA PNG: '+info.filename)
                      frames[folder][frame]=data
          if len(frames)!=29 or sum(map(len,frames.values()))!=348:
              raise ValueError('Expected 29 folders and 348 frames')
          expected={f'frame_{i:02d}.png' for i in range(12)}
          for folder, files in frames.items():
              if set(files)!=expected: raise ValueError('Missing frame in '+folder)
              dest=target/folder
              dest.mkdir(parents=True,exist_ok=True)
              for filename,data in files.items():
                  (dest/filename).write_bytes(data)
          print('Validated and extracted 29 skin folders / 348 RGBA PNG frames')
          PY

      - name: Commit assets to the existing pull request branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skins3d/
          if git diff --cached --quiet; then
            echo "Assets already imported."
          else
            git commit -m "Import 29 3D socket skins with 348 ordered animation frames"
            git push origin HEAD:feature/3d-rolling-skin-loader
          fi
