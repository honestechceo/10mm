let dx=world-scroll-210;if(dx<W+290)destination(dx);for(const p of powerups){if(p.taken)continue;let px=p.x-scroll;if(px<-30||px>W+30)continue;ctx.fillStyle=p.type==='shield'?'#55d7ed':p.type==='slow'?'#a6e478':'#ffca48';ctx.beginPath();ctx.arc(px,p.y,19,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#182733';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText(p.type==='shield'?'◆':p.type==='slow'?'◷':'↑',px,p.y+8);ctx.textAlign='left'}if(chase!=='none'){let hx=35+Math.sin(frames*.055)*12;ctx.save();ctx.translate(hx,ground-65+Math.sin(frames*.07)*9);if(chase==='hand'){ctx.fillStyle='#f2b47e';ctx.strokeStyle='#75462d';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(-50,-16,75,33,15);ctx.fill();ctx.stroke();for(let i=0;i<4;i++){ctx.beginPath();ctx.roundRect(7+i*8,-29+i*2,13,28,6);ctx.fill();ctx.stroke()}ctx.fillStyle='#26323e';ctx.font='bold 12px system-ui';ctx.fillText('GOTCHA!',-45,-32)}else{ctx.fillStyle='#e34b4b';ctx.fillRect(-20,-22,15,43);ctx.fillRect(12,-22,15,43);ctx.fillStyle='#bbc6cf';ctx.fillRect(-20,13,15,9);ctx.fillRect(12,13,15,9);ctx.strokeStyle='#e34b4b';ctx.lineWidth=17;ctx.beginPath();ctx.arc(4,-22,23,Math.PI,0);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.fillText('MAGNET',-25,-53)}ctx.restore()}if(shield>0){ctx.strokeStyle='#63e5f6';ctx.lineWidth=4;ctx.beginPath();ctx.arc(player.x,player.y,34,0,Math.PI*2);ctx.stroke()}
ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle);image('socket10',0,0,52,52);ctx.restore();
ctx.fillStyle='#e9eef3';ctx.font='bold 14px system-ui';ctx.fillText('10mm',player.x-21,player.y-39);
ctx.fillStyle='#ffcb43';ctx.fillRect(0,0,W*Math.min(1,(scroll+player.x)/(world-100)),5)}
function tick(t){if(state!=='running')return;let dt=Math.min(2.2,(t-(last||t))/16.67);last=t;let speed=(3.25+Math.min(2.9,level*.022))*(slow>0?.68:1)*dt;scroll+=speed;frames+=dt;if(shield>0)shield-=dt;if(slow>0)slow-=dt;player.vy+=.54*dt;player.y+=player.vy*dt;if(player.y>=ground-player.r){player.y=ground-player.r;player.vy=0;player.jumps=0}player.angle+=speed*.045+(player.vy!==0?.035:0);$('distance').textContent=Math.min(100,Math.floor((scroll+player.x)/world*100))+'%';
for(const o of obstacles){let x=o.x-scroll;if(shield<=0&&Math.abs(x-player.x)<player.r+o.w*.40&&player.y+player.r>ground-o.h+7&&player.y-player.r<ground-3){render();popup('CLANK! 💥','Your 10mm hit a '+o.kind+'. Try timing your jumps to get underneath the '+destinations[(level-1)%4].toLowerCase()+'.','TRY AGAIN',start);return}}
for(const p of powerups){if(!p.taken&&Math.abs(p.x-scroll-player.x)<37&&Math.abs(p.y-player.y)<52){p.taken=true;if(p.type==='shield')shield=320;else if(p.type==='slow')slow=340;else {player.vy=-12;player.jumps=1}$('tip').textContent=p.type==='shield'?'Shield activated!':p.type==='slow'?'Slow motion activated!':'Spring bounce!'}}if(chase==='magnet'&&shield<=0&&frames>60&&frames%210<65&&player.y<ground-player.r-30){player.vy+=.13*dt}if(chase==='hand'&&shield<=0&&frames>60&&frames%270>225&&player.y>=ground-player.r-2){$('tip').textContent='The hand is catching up — JUMP!'}if(scroll+player.x>=world-170){if(goalMode==='drawer'&&(player.y>ground-65||player.y<ground-190)){scroll=world-250;render();$('tip').textContent='Jump into the open drawer!';rafId=requestAnimationFrame(tick);return}best=Math.max(best,Math.min(200,level+1));localStorage.setItem('tenmm-escape-best',best);render();popup('THE 10MM VANISHED! 🎉','You '+(goalMode==='drawer'?'jumped into the open drawer':'escaped underneath the '+destinations[(level-1)%4].toLowerCase())+'! Ready for the next garage?',level===200?'PLAY AGAIN':'NEXT LEVEL',()=>{level=level===200?1:level+1;start()});return}
render();rafId=requestAnimationFrame(tick)}
function showMenu(){cancelAnimationFrame(rafId);state='menu';$('overlay').classList.remove('hidden');$('eyebrow').textContent='THE GREAT SOCKET ESCAPE';$('menuArt').textContent='🔧 🧰';$('message').textContent='WHERE’S MY 10MM?!';$('details').textContent='Every mechanic loses a 10mm. This one is running away! Roll, double-jump and hide before you get caught.';$('go').textContent='▶ PLAY ADVENTURE';$('go').onclick=()=>{level=1;if(!storySeen)showStory();else if(!tutorialSeen)showTutorial();else start()};$('menuExtra').style.display='';$('menuExtra').textContent='HOW TO PLAY';$('menuExtra').onclick=showTutorial;$('menuSettings').style.display='';$('menuSettings').onclick=showSettings}
function showStory(){state='story';$('overlay').classList.remove('hidden');$('menuSettings').style.display='none';$('menuExtra').style.display='';$('menuExtra').textContent='SKIP INTRO';$('menuExtra').onclick=()=>{storySeen=true;localStorage.setItem('tenmm-story','yes');showTutorial()};const scenes=[['🧑‍🔧 🔧','A mechanic reaches for a 10mm socket…'],['🔩 💨','But the socket rolls away!'],['🔧 🧲','Tools, magnets and a chasing hand block its escape.'],['🧰 🔩','Can the 10mm disappear into a drawer before it gets caught?']];let index=0;function next(){if(index>=scenes.length){storySeen=true;localStorage.setItem('tenmm-story','yes');showTutorial();return}$('menuArt').textContent=scenes[index][0];$('eyebrow').textContent='THE STORY • '+(index+1)+'/4';$('message').textContent='THE GREAT ESCAPE';$('details').textContent=scenes[index][1];$('go').textContent=index===scenes.length-1?'LET’S PLAY':'NEXT';$('go').onclick=()=>{index++;next()}}next()}
function showTutorial(){state='tutorial';$('overlay').classList.remove('hidden');$('menuArt').textContent='🔩 ↗️';$('eyebrow').textContent='HOW TO PLAY';$('message').textContent='LEARN THE ESCAPE';$('details').textContent='Tap JUMP or the play area once to hop. Tap again while airborne for a true double jump. Collect glowing power-ups, avoid tools, and reach the hiding place. The first three levels are shorter and easier.';$('go').textContent='START LEVEL 1';$('go').onclick=()=>{tutorialSeen=true;localStorage.setItem('tenmm-tutorial','yes');level=1;start()};$('menuExtra').style.display='';$('menuExtra').textContent='MAIN MENU';$('menuExtra').onclick=showMenu;$('menuSettings').style.display='none'}
function showSettings(){state='settings';$('menuArt').textContent='⚙️';$('eyebrow').textContent='SETTINGS';$('message').textContent='GAME OPTIONS';$('details').textContent='Sound effects: '+(soundOn?'ON':'OFF')+' (audio effects are planned for a future update).';$('go').textContent='TOGGLE SOUND';$('go').onclick=()=>{soundOn=!soundOn;localStorage.setItem('tenmm-sound',soundOn?'on':'off');showSettings()};$('menuExtra').style.display='';$('menuExtra').textContent='BACK';$('menuExtra').onclick=showMenu;$('menuSettings').style.display='none'}
createLevel();render();showMenu();
</script></body></html>
